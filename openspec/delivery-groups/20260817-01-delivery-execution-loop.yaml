verification:
  change:
    requireApplicableChecks: true
  fullTest:
    requiresOwnerAuthorization: true
    execution:
      id: "project-full-verification"
      kind: command
      command: "npm"
      args:
        - "run"
        - "verify:full"
      launcherMode: npm-shim
      scope: delivery
      timeoutMs: 120000
      resultProtocol: flowkit-full-test-result-v1
      resultAuthority: verification
      expectedTerminalStatuses:
        - "passed"
        - "failed"
    plan:
      - "Deterministic Core suite"
      - "Change Execution Loop suite"
      - "Delivery readiness projection"
      - "Delivery behavior Policy result (Full Test no-Run / Finalize no-Run)"
      - "Full Test authorization boundary"
      - "Full Test failure / corrective Change lifecycle"
      - "02 Final verification retry/history regressions"
      - "OpenSpec archive-sync completeness regression"
      - "FLOWKIT_HOME resolution"
      - "OpenSpec managed offline tool"
      - "OpenSpec legacy migration compatibility"
      - "Archify exact release identity"
      - "offline Archify doctor"
      - "Archify validate architecture"
      - "Archify deliver architecture"
      - "Archify compare architecture"
      - "no ambient PATH canonical dependency"
      - "architecture/<delivery-id>/json durable-source layout"
      - "architecture/<delivery-id>/html local derived-view layout"
      - "flowkit architecture render current/planned/actual thin wrapper"
      - "flowkit architecture compare thin wrapper"
      - "initial post-02 System baseline"
      - "03 bootstrap Planned reconciliation"
      - "normal future Planned lifecycle"
      - "Actual / Compare / Promotion"
      - "HTML absence/staleness does not create second authority"
      - "Delivery Finalize no-Run invariant"
      - "Git Delivery Final boundary"
      - "sync/resume"
      - "three-file new Run / historical legacy Run compatibility"
      - "single-action Agent Adapter"
      - "Bootstrap fixture E2E"
      - "quality hard guards"
      - "typecheck"
      - "lint"
      - "build"
      - "OpenSpec strict"
      - "Windows compatibility regression"
      - "performance/timing"

acceptance:
  - "Delivery Ready 可确定性计算（required Changes completed + checkpoints present + Blocking Findings = 0 + formal facts consistent + Full Test Plan available）"
  - "Policy 可表达 Delivery behavior 而不伪造 Formal Action / Run"
  - "Full Test 必须 Owner 独立明确授权，不创建 Run"
  - "Full Test failure -> Delivery Finding + Owner decision，不自动 corrective Change；corrective Change 使用普通 Change lifecycle"
  - "FLOWKIT_HOME/tools 最小 external-tool model 可用，canonical 执行不依赖 ambient PATH"
  - "OpenSpec canonical 执行可使用 exact managed offline distribution"
  - "Archify canonical 执行可使用 exact managed offline distribution"
  - "legacy OpenSpec launcher/override compatibility 有明确 bounded migration"
  - "repository 顶层 architecture/ layout 可用；JSON 是 durable source；HTML 是派生视图、默认不提交、可删除重建、非 authority"
  - "initial post-02 System Architecture baseline 来自 exact pre-03 baseline，03 working tree 不污染 Current"
  - "03 Bootstrap Planned reconciliation provenance 明确"
  - "Actual 必须从 final repository 重新观察，不得复制 Planned 冒充"
  - "flowkit architecture render current|planned|actual / compare 是薄 Archify CLI wrapper"
  - "Planned vs Actual compare 提供结构证据，不构成 Review verdict / Owner decision"
  - "Accepted Actual 以 ref promotion 成为下一 Delivery Current 来源"
  - "Finalize 必须 Owner 授权，不创建 Run，Delivery Final Git boundary 正确"
  - "PR Merge Commit workflow 保留 Delivery topology，不 squash/rebase"
  - "sync/resume 无聊天依赖；thin Agent Adapter 一次只执行一个 Change Action"
  - "new Change Run 保持 action.md/context.json/result.json 三文件；historical E1 legacy Run 可读"
  - "generic Change Verification 与 exact-candidate retry/history baseline 不回归"
  - "stable Runner 可用；Bootstrap E2E 通过；self-hosting acceptance passed"
  - "不存在 auto review/revise、bounded auto-continue、Registry / Evidence platform"
