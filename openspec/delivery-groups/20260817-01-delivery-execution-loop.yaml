id: "20260817-01-delivery-execution-loop"
createdAt: "2026-08-17"
branch: "delivery/20260817-01-delivery-execution-loop"

goal: "在已完成的 Deterministic Core 与 Change Execution Loop 基础上交付完整 Delivery Execution Loop：让 Flowkit 能够从 Delivery Start 开始，经过 Current System Architecture 冻结、Planned Architecture、Change 生命周期、Delivery Ready、Owner 授权 Full Test、Actual Architecture 与 Planned-vs-Actual Compare、Owner Finalize 与 Delivery Final Git boundary，确定性关闭整条 Delivery。本 Delivery 是最后一条 Bootstrap Delivery；不实现自动 Author/Reviewer 循环、bounded auto-continue、Tool Registry、Skill Registry、Evidence platform 或自动 Commit/Push/Merge。"

delivery:
  state: active
  fullTestStatus: not-ready

scope:
  included:
    - "Delivery readiness projection"
    - "Delivery behavior Policy representation (Full Test / Finalize no-Run)"
    - "Owner-authorized Full Test behavior"
    - "fullTestStatus persistence/projection"
    - "Delivery Finding + corrective Change owner boundary"
    - "FLOWKIT_HOME minimal local-environment contract"
    - "shared external-tool home resolution (FLOWKIT_HOME/tools)"
    - "OpenSpec 1.7 managed offline distribution"
    - "Archify v2.14.0 official offline distribution"
    - "exact external-tool identity / doctor / fail-closed semantics"
    - "repository-level architecture/<delivery-id>/json durable source layout"
    - "architecture/<delivery-id>/html disposable derived view layout"
    - "initial post-02 System Architecture baseline (exact main @ 74d46f0)"
    - "03 bootstrap Planned Architecture reconciliation"
    - "Actual Architecture from final repository"
    - "Planned vs Actual compare (thin Archify wrapper)"
    - "accepted Actual -> next SystemArchitectureRef"
    - "Delivery Finalize behavior + Delivery Final Git boundary"
    - "sync / resume (no chat dependency)"
    - "consume 02 generic Change Verification / three-file Run baseline"
    - "consume exact-candidate Verification retry/history baseline"
    - "thin single-Change-Action Agent Adapter"
    - "stable Runner"
    - "Bootstrap E2E fixture"
    - "self-hosting acceptance"
    - "Delivery-level performance observation"
  excluded:
    - "automatic Author/Reviewer loop"
    - "bounded auto-continue"
    - "background autonomous multi-action execution"
    - "automatic Full Test / Finalize authorization"
    - "automatic corrective Change"
    - "automatic Merge"
    - "Tool Registry / marketplace / auto installer"
    - "Plugin / Provider / Agent / Gate Registry"
    - "Skill Registry / Skill installer"
    - "Evidence / Receipt platform"
    - "Archify source vendoring"
    - "reimplement Archify renderer/schema"
    - "OpenSpec source vendoring"
    - "CodeGraph platform"
    - "per-Change architecture regeneration"
    - "architecture JSON inferred from chat memory"

architecture:
  impact: true
  archifyPlan: "deferred-to-03"

changes:
  - key: "A1"
    id: "delivery-readiness-and-full-test-behavior"
    goal: "让 Flowkit 确定性判断 Delivery Ready，并在 Owner 授权后执行 Delivery Full Test；Full Test 是 Delivery behavior，不是 Change Action/Run。"
    required: true
    dependsOn:
      []
    state: completed
    architectureImpact: true
    outputs:
      - "Delivery readiness projection"
      - "Full Test Plan contract"
      - "Owner authorize-full-test boundary"
      - "fullTestStatus lifecycle"

  - key: "B1"
    id: "delivery-findings-and-corrective-change"
    goal: "把 Delivery Full Test failure 变成 Delivery-level Finding + Owner decision，而不是重开 completed Change 或自动修复。"
    required: true
    dependsOn:
      - "delivery-readiness-and-full-test-behavior"
    state: planned
    architectureImpact: true
    outputs:
      - "failed Full Test projection"
      - "minimal Delivery Finding"
      - "Owner corrective-Change decision boundary"
      - "fullTestStatus reset to not-ready"

  - key: "C1"
    id: "external-tool-runtime-and-archify-cli-contract"
    goal: "建立一个最薄的 shared External Tool Runtime，使 OpenSpec 与 Archify 都能通过 FLOWKIT_HOME/tools 使用 exact offline distribution，消除 canonical ambient PATH ambiguity。"
    required: true
    dependsOn:
      - "delivery-findings-and-corrective-change"
    state: planned
    architectureImpact: true
    outputs:
      - "FLOWKIT_HOME/tools layout"
      - "OpenSpec 1.7.0 managed offline distribution"
      - "Archify v2.14.0 official offline distribution"
      - "exact tool identity / doctor / fail-closed semantics"

  - key: "D1"
    id: "architecture-baseline-and-delivery-plan"
    goal: "建立 Flowkit 第一个可信 System Architecture baseline，并把 03 的计划能力表达成 Planned Architecture；Architecture assets 位于 repository 顶层 architecture/。"
    required: true
    dependsOn:
      - "external-tool-runtime-and-archify-cli-contract"
    state: planned
    architectureImpact: true
    outputs:
      - "architecture/<delivery-id>/json/** durable source layout"
      - "post-02 Current/System baseline"
      - "03 bootstrap Planned reconciliation"
      - "Archify validate binding"

  - key: "E1"
    id: "architecture-actual-compare-and-system-promotion"
    goal: "Delivery final candidate 形成 Actual Architecture，与 Planned 做 Archify compare；Owner 接受后，Accepted Actual ref 成为下一 Delivery 的 System Architecture baseline。"
    required: true
    dependsOn:
      - "architecture-baseline-and-delivery-plan"
    state: planned
    architectureImpact: true
    outputs:
      - "Actual Architecture from final repository"
      - "Planned vs Actual compare"
      - "accepted ActualArchitectureRef -> SystemArchitectureRef promotion"

  - key: "F1"
    id: "delivery-finalize-and-git-boundary"
    goal: "在所有 Delivery completion preconditions 与 Owner Finalize authorization 满足后，正式关闭 Delivery，并形成 Delivery Final Git boundary。"
    required: true
    dependsOn:
      - "architecture-actual-compare-and-system-promotion"
    state: planned
    architectureImpact: true
    outputs:
      - "finalization precondition projection"
      - "Owner authorize-finalize boundary"
      - "Delivery state -> completed"
      - "Delivery Final Git boundary"

  - key: "G1"
    id: "sync-resume-and-single-action-agent-adapter"
    goal: "让 Delivery/Change 状态可以只依赖 repository/formal facts resume；提供稳定的、一次一个 Change Action 的薄 Agent Adapter。"
    required: true
    dependsOn:
      - "delivery-finalize-and-git-boundary"
    state: planned
    architectureImpact: true
    outputs:
      - "Delivery resume projection"
      - "Verification.md + verification-history lineage read"
      - "single-action Agent Adapter"

  - key: "H1"
    id: "stable-runner-and-self-hosting-acceptance"
    goal: "发布 stable Runner，并通过 disposable end-to-end fixture 证明 01+02+03 已形成可以管理下一条真实 Delivery 的 MVP。"
    required: true
    dependsOn:
      - "sync-resume-and-single-action-agent-adapter"
    state: planned
    architectureImpact: true
    outputs:
      - "stable dist/bin/flowkit.js"
      - "full Bootstrap fixture"
      - "Bootstrap E2E / self-hosting acceptance"
      - "post-03 SystemArchitectureRef"

