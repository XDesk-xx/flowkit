acceptance:
  - "A real ChatGPT web detached Linux session completes one legal Standard Action from prepare/exact resume through existing admission to a terminal Run with result.json, reports the exact next boundary, and stops without a second Action."
  - "An interruption before admission exact-resumes the same pending runId without chat/provider session authority or replacement Run; local canonical AI follows the same contract without extra manual steps."
  - "Exact Stable Flowkit 03 manages the complete 04 lifecycle and Candidate 04 never becomes current authority before real Delivery Final."
  - "Cross-platform exact-byte/fingerprint behavior is explicitly proven closed or corrected before Stable environment identity is accepted."
  - "Stable environment materialization and verification bind exact Flowkit runtime, managed tools, accepted repo instructions, launchers, content identity, and deterministic post-Final promotion input while preserving the previous Stable."
  - "Managed OpenSpec 1.9.0 works from exact offline identity through required create/status/instructions/validate/apply/archive/retry/historical-read boundaries without an adapter generation family."
  - "Flowkit Action Skills and Author preflight improve execution quality while preserving Policy, Owner, Reviewer, Verification, OpenSpec, and Git authority boundaries."
  - "Architecture Reference and Delivery Description identities remain continuous; Current→Planned, Current→Actual, and Planned→Actual each compose the two independently rendered Archify HTML artifacts into an equal-size left-before/right-after Pair View with pair-scoped refs and no delta column, semantic comparator, output overwrite, or authority."
  - "CodeGraph remains optional, the deterministic fallback path works, and no code-context output becomes lifecycle authority."
  - "New/changed code does not materially worsen quality without explicit justification, and one proof-selected hotspot obtains a clearer bounded responsibility without broad refactoring."
  - "Stable 04 candidate is exact, offline-capable, independently consumable, and tamper-evident; promotion occurs only after real 04 Delivery Final."
