goal: "由 exact Stable Flowkit 03 外部管理完整 04 Delivery；首先建立 ChatGPT interactive Agent 的单 Action 执行闭环，然后按依赖完成 cross-platform exact-byte correctness、Stable execution/promotion、managed OpenSpec migration、Flowkit Action Skills、Author preflight、Architecture Description continuity与same-source side-by-side Pair Views、incremental quality、bounded responsibility improvement 与 Stable 04 candidate acceptance；candidate 在真实 Delivery Final 前不得替换 current Stable authority。"

delivery:
  state: active
  fullTestStatus: not-ready

scope:
  included:
    - "Interactive single-Action execution completion in local canonical and real ChatGPT web detached Linux environments"
    - "prepared/resumed continuation, existing result admission, exact pending recovery, terminal stop, and no automatic second Action"
    - "cross-platform CRLF/exact-byte fingerprint correctness closure"
    - "Stable N exact execution environment identity, deterministic materialization/verification, Candidate N+1 isolation, and post-Final promotion input"
    - "managed OpenSpec 1.9.0 offline migration with bounded compatibility proof"
    - "Flowkit-specific Action Skills, independent Review contract, Simplified Chinese narrative default, and exact machine literals"
    - "Author mechanical preflight without Author self-review"
    - "Architecture Description continuity across Reference and Current/Planned/Actual with same-source Current→Planned, Current→Actual, and Planned→Actual side-by-side Pair Views"
    - "CodeGraph as optional on-demand code context with deterministic Git/rg/source/tests fallback"
    - "incremental quality admission for new/changed code"
    - "one proof-selected bounded responsibility improvement"
    - "proof-gated zero-active-Delivery diagnostics and Verification engineering follow-up"
    - "independent Stable 04 candidate acceptance without mid-Delivery promotion"
  excluded:
    - "Flowkit Core lifecycle redesign or second Policy/execution state machine"
    - "Provider Registry, Agent Registry, Skill Registry, Tool Registry, Release Registry, Gate Registry, scheduler, daemon, or background worker"
    - "automatic next, automatic Author/Reviewer role alternation, or while(next) workflow"
    - "automatic Owner decision, corrective Change, Full Test, Finalize, Commit, Push, Merge, or promotion"
    - "generic candidate ZIP transport protocol, online installer, project Bootstrap, or project Upgrade platform"
    - "CodeGraph mandatory integration or lifecycle authority"
    - "Evidence/Receipt platform, generic Issue Tracker, or backlog platform"
    - "Flowkit custom architecture renderer/viewer or generic projection engine"
    - "large-scale architecture rewrite, broad repository refactor, or new internal V1/V2 generation families"
    - "generic rollback engine, Verification telemetry platform, dynamic scheduler, or automatic timeout tuning"

