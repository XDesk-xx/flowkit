id: 20260810-01-change-execution-loop
createdAt: "2026-08-10"
branch: delivery/20260810-01-change-execution-loop

goal: >
  在已完成的 Deterministic Core 基础上交付完整 Change Execution Loop：
  让 Flowkit 能够从 planned Change 开始，经过 Owner 授权、正式 Change Action、
  Lean Run、Author / Reviewer、Change Verification、OpenSpec archive，
  确定性地把 Change 关闭为 completed，并进入 Git Change Checkpoint boundary。
  本 Delivery 不实现 Delivery Full Test / Delivery Finalize executor、
  Archify runtime、stable Agent runtime 或自动 Author / Reviewer 循环。

delivery:
  state: completed
  fullTestStatus: passed

technicalBaseline:
  language: TypeScript
  moduleSystem: ESM
  runtime: Node.js
  nodeVersion: ">=22.0.0"
  sourceExtension: .ts
  compiledOutput: dist/**/*.js
  cliBin: dist/bin/flowkit.js
  constraints:
    - 继承 Deterministic Core 的 Lean Run 与 machine-derived ResultRef
    - 继承 focused / affected / full Verification 分层与 Quality Guard
    - 新增手写生产源码和测试源码继续使用 .ts
    - 不新增手写 .mjs 生产源码、测试源码或 CLI 启动壳
    - Windows CLI / process 路径继续使用 platform launcher
    - Change Checkpoint 前执行 git diff --check，staging 后执行 git diff --cached --check
    - 不建立 Registry / Evidence / Receipt / generic plugin platform
    - 不实现自动 Commit / Push / Merge

scope:
  included:
    - Q1 canonical contract alignment
    - Delivery / Change creation
    - Owner decision ingestion / provenance
    - Change activation
    - Lean Run lifecycle
    - Action Package
    - Action Result admission
    - ResultRef validation
    - OpenSpec 1.7 thin integration
    - Review / typed Findings / Verdict
    - blockingAuthority
    - Finding convergence
    - non-author facts 到位后的 direct re-review
    - no-op revise rejection
    - immutable Action entry / Core-owned post-action fact boundary
    - exact target Run resume / timeout outcome-unknown / idempotent terminal replay
    - operation-scoped OpenSpec projection / Windows process-tree cancellation
    - actualChangeSet
    - verificationScope
    - focused / affected Change Verification
    - OpenSpec archive
    - Change completed transition
    - Checkpoint readiness / recognition / Git handoff
    - Change CLI
    - resume-context
    - Change E2E
    - performance / Run-size observation

  excluded:
    - Delivery Full Test execution implementation
    - Delivery Findings full loop
    - Delivery Finalize executor
    - Delivery-level Run
    - Archify runtime / architecture assets
    - stable Agent Adapter
    - automatic Author / Reviewer loop
    - bounded auto-continue
    - automatic corrective Change
    - automatic Commit / Push / Merge
    - mandatory CodeGraph integration
    - Registry / Evidence platform

architecture:
  impact: true
  archifyPlan: deferred-to-03
  rationale: >
    本 Delivery 会新增完整 Change Execution Plane，具有架构影响。
    但 Archify 是 Delivery-level external architecture authority，
    正式 Archify CLI contract、System / Planned / Actual Architecture lifecycle
    由下一条 Delivery Execution Loop Delivery（03）实现。
    本 Delivery 只保留 architectureImpact / architecture decision 语义，
    不调用 Archify runtime，不生成或回填正式 architecture asset。

changes:
  - key: Q1
    id: core-contract-alignment
    goal: >
      对当前 canonical Core 做最小 contract alignment：
      机器化 changes-requested ≠ revise-required、blocking authority、
      no-op revise prohibition，并把 Standard Run 收敛为 Change-only Action；
      不重新打开或重做已完成的 Deterministic Core。
    required: true
    dependsOn: []
    state: completed
    outputs:
      - canonical blocker-authority contract alignment
      - Change-only Standard Run / Action boundary
      - non-author blocker direct re-review 与 no-op revise contract
      - docs / specs / code / AGENTS 的最小一致性修正

  - key: A1
    id: delivery-change-creation-and-owner-input
    goal: >
      实现 Delivery / Change 创建、显式 Owner decision / authorization provenance
      的安全接纳，以及满足依赖和 Owner 授权后的 Change activation。
    required: true
    dependsOn:
      - core-contract-alignment
    state: completed
    outputs:
      - Delivery creation
      - Change creation
      - Owner decision / authorization provenance ingestion
      - planned → active Change activation boundary

  - key: B1
    id: lean-run-and-action-package
    goal: >
      完成 Lean Run lifecycle、Action Package、Action Result admission
      与 ResultRef validation，使一个已确定的 Change Action
      能通过轻量 execution envelope 被安全执行、恢复和接纳。
    required: true
    dependsOn:
      - delivery-change-creation-and-owner-input
    state: completed
    outputs:
      - Lean Run lifecycle 与 Delivery-wide monotonic Run ID
      - Action Package
      - Action Result validation / admission
      - machine-derived / validated ResultRef
      - pending Run resume / same-Run continuation contract

  - key: C1
    id: openspec-1-7-thin-integration
    goal: >
      建立 OpenSpec 1.7 thin integration，让 OpenSpec 继续拥有 Change contract、
      artifact lifecycle 和 archive semantics，Flowkit 只消费结构化 context、
      path、validation 与 archive operation result。
    required: true
    dependsOn:
      - lean-run-and-action-package
    state: completed
    outputs:
      - OpenSpec 1.7 thin adapter
      - structured planningHome / changeRoot / artifactPaths / contextFiles 消费
      - formal Change artifact lifecycle integration
      - archive handoff / result consumption

  - key: D1
    id: review-findings-and-blocker-authority
    goal: >
      实现 typed Findings、稳定 Finding identity、blockingAuthority、
      finding convergence，以及 changes-requested 后按 authority
      确定下一 boundary 的 Review 闭环。
    required: true
    dependsOn:
      - openspec-1-7-thin-integration
    state: completed
    outputs:
      - typed Finding model
      - blockingAuthority: author / owner / verification / external
      - resolved / still-open / superseded / new convergence
      - non-author fact direct re-review
      - no-op revise rejection

  - key: E1
    id: change-verification-selection-and-change-set
    goal: >
      同时修复两类已观测的执行时间边界缺口：分离 Apply / revise-apply
      immutable entry facts 与 Core-owned post-action facts，并分离 Policy-selected
      new Run preparation 与 exact target Run retry；在 timeout outcome-unknown、
      terminal replay、Windows process tree 和重复 OpenSpec projection 下保持
      fail-closed。基于 canonical Git boundary、actualChangeSet、确定性 module
      ownership / dependency mapping 与 OpenSpec affected capability，生成最小
      verificationScope 并执行 Change Verification。
    required: true
    dependsOn:
      - review-findings-and-blocker-authority
    state: completed
    outputs:
      - immutable context v5 entry identity / ActionPackage v2 declaration migration
      - Core-owned post-action actualChangeSet / verification-selection record
      - exact target Run resume / idempotent terminal replay
      - timeout outcome-unknown / late-completion generation safety
      - operation-scoped OpenSpec projection / bounded external command cancellation
      - actualChangeSet
      - change-set classification
      - deterministic verificationScope
      - focused / affected Change Verification selection
      - formal verification.md result projection

  - key: F1
    id: archive-and-checkpoint-boundary
    goal: >
      在 review-apply approved、Blocking=0、Change Verification 满足、
      tasks complete、正式事实一致且 Owner authorize archive 后，
      通过 OpenSpec archive 关闭 Change，并暴露后续 Git Change Checkpoint boundary。
    required: true
    dependsOn:
      - change-verification-generalization-and-lean-run-normalization
    state: completed
    outputs:
      - archive precondition enforcement
      - OpenSpec archive result integration
      - Change.state = completed transition
      - checkpoint readiness / recognition
      - Git checkpoint handoff / deterministic preflight

  - key: G1
    id: change-cli-end-to-end-and-performance
    goal: >
      收口 Change CLI、resume-context、完整 Change E2E 与性能观测，
      证明正常 Change 可以从 planned 确定性执行到 completed
      并恢复到 checkpoint boundary。
    required: true
    dependsOn:
      - archive-and-checkpoint-boundary
    state: completed
    outputs:
      - Change CLI surface
      - Change E2E matrix
      - checkout / resume recovery
      - Action Package / Run size observation
      - focused / affected verification timing observation
      - review convergence observation



  - key: "D2"
    id: "archive-terminal-continuation-correction"
    goal: "修复 OpenSpec archive 已结构化成功并迁移 active Change 后，Flowkit archive terminal admission 仍依赖已移除 active Change 状态而无法闭合 pending Run 的缺口；使既有 085 terminal-observation 可通过正式 recovery/admission surface 闭合，并保证后续 archive 在相同 post-mutation 语义下直接 terminalize。"
    required: true
    dependsOn:
      - "review-findings-and-blocker-authority"
    state: completed
    architectureImpact: false
    outputs:
      - "archive post-mutation terminal admission contract"
      - "preArchive semantic identity 与 structured terminal observation 的 fail-closed validation"
      - "existing 085 terminal-observation formal recovery"
      - "future archive success relocation regression coverage"

  - key: "E2"
    id: "change-verification-generalization-and-lean-run-normalization"
    goal: "把 E1 已证明正确的 Change Verification execution-time / exact-resume 语义从 current E1 identity 与 Bootstrap sidecar 特化中解耦，泛化为任意 current Change 可复用的 deterministic Verification Catalog / current-Change OpenSpec projection，并恢复 prospective new Run writer 为 action.md / context.json / result.json 三文件模型；保持 historical E1 sidecar immutable + readable，且不重新打开 E1 已收敛的 execution time、Contract Reset、exact resume 或 archive recovery。"
    required: true
    dependsOn:
      - "change-verification-selection-and-change-set"
    state: completed
    architectureImpact: false
    outputs:
      - "generic source-controlled Change Verification Catalog / selection"
      - "current-Change OpenSpec verification without E1 identity hardcode"
      - "prospective three-file Run writer"
      - "historical E1 sidecar read compatibility"
      - "persisted verification publication identity / historical selection independence"
      - "F1/G1-shaped next-consumer regression and structural verification performance simplification"

  - key: "H1"
    id: "historical-fixture-and-test-performance-correction"
    goal: "修复 G1 archive 后真实 CLI E2E fixture 仍依赖 active OpenSpec Change 路径、historical E1 real-OpenSpec fixture 把 point-in-time delta 与 future/current canonical spec 错误比较、以及 real OpenSpec integration target 未被 formal Change Verification 物理执行的问题；同时在不降低 acceptance coverage、不扩大 timeout、不引入 cache/parallel framework 的前提下减少重复 fixture construction 与 CLI/OpenSpec subprocess，使 02 Delivery Full Test 可稳定执行。"
    required: true
    dependsOn:
      - "change-cli-end-to-end-and-performance"
    state: completed
    architectureImpact: false
    outputs:
      - "archive-safe G1 real-process CLI E2E fixture"
      - "historical E1 / real OpenSpec temporal-authority fixture correction"
      - "formal Verification physical coverage for changed real OpenSpec integration targets"
      - "duplicate fixture/process reduction with unchanged correctness coverage"
      - "post-archive full-suite regression and performance evidence"

  - key: "I1"
    id: "delivery-final-closure-correction"
    goal: "关闭 02 Delivery 正式 Full Test 与 Change Checkpoint 收口阶段已经证明存在的剩余缺口：统一 OpenSpec executable resolved authority，确保 Delivery Full Test 真实执行 real OpenSpec conformance 而不 silent-skip，消除 current Delivery lifecycle fixture 对可增长 Change 数量的耦合，并把 OpenSpec archive 后严格限定的 whitespace-only normalization 收敛为 checkpoint mechanics；同时通过完整 performance 与 future-consumer proof 证明收口方案不降低 coverage、不引入新的环境耦合或不必要 runner 设计。"
    required: true
    dependsOn:
      - "historical-fixture-and-test-performance-correction"
    state: completed
    architectureImpact: false
    outputs:
      - "single resolved OpenSpec executable authority across production, Change Verification, G1 E2E and Delivery Full Test"
      - "Delivery Full Test physical execution closure for real OpenSpec 1.7 conformance with fail-closed sentinel"
      - "stable temporal fixture for current-corpus A1 regression independent of future Change-count growth"
      - "bounded deterministic archive-to-checkpoint whitespace normalization authority"
      - "performance evidence for process-heavy Full Test execution without speculative scheduler changes"
      - "future corrective Change and next-Delivery shaped closure evidence"
