  change:
    requireApplicableChecks: true

  fullTest:
    requiresOwnerAuthorization: true
    plan:
      - Deterministic Core inherited suite
      - Q1 contract alignment
      - Delivery / Change creation and Owner provenance
      - Lean Run / Action Package / Action Result / ResultRef
      - OpenSpec 1.7 thin integration
      - typed Findings / blockingAuthority
      - no-op revise rejection
      - non-author fact direct re-review
      - immutable entry / post-action fact boundary
      - exact target Run retry / timeout outcome-unknown / terminal replay
      - OpenSpec projection deduplication / Windows process-tree cancellation
      - actualChangeSet / verificationScope
      - Change Verification selection
      - archive / completed / checkpoint boundary
      - Change CLI E2E
      - resume / checkout recovery
      - quality hard guards
      - typecheck
      - lint
      - build
      - OpenSpec strict validation
      - Windows launcher regression
      - whitespace preflight contract

acceptance:
  - 所有 required Changes 的 state 均为 completed
  - 所有 required Changes 均已形成 Git Change Checkpoint
  - Q1 只做最小 canonical contract alignment，没有重做 Deterministic Core
  - canonical product contract 已吸收 blocking authority
  - Standard Run 只覆盖 Change Actions
  - Delivery Full Test / Delivery Finalize 不创建 Standard Run
  - Owner decision provenance 可安全接纳，且只能来自 Owner 独立明确输入
  - 一个 Change 可从 planned 确定性执行到 completed
  - OpenSpec archive success 即关闭 Change，Checkpoint 不反向成为 Change completion condition
  - Run 保持 Lean，不重新拥有 OpenSpec / Git / Verification / Reviewer 专业事实
  - OpenSpec 1.7 thin integration 可用
  - typed Finding + blockingAuthority 可用
  - changes-requested ≠ revise-required 已机器化
  - non-author blocker 在 bytes 不变时可 direct re-review
  - no-op revise 可被拒绝
  - timeout / late completion 后 exact target retry 不会创建下一 Action generation
  - terminal replay 绑定 persisted Run identity 并保持幂等或 fail closed
  - 单次 formal operation 共享 bounded OpenSpec projection，Windows timeout 不伪装为 writer 已停止
  - actualChangeSet / verificationScope 可确定性生成
  - Change Verification 可用，且任何 Change path 不自动运行 Delivery Full Test
  - Change CLI / resume-context 可用
  - Delivery Full Test 仅在 Owner explicit authorization 后执行并通过
  - Delivery Finalize 仅在 Owner independent authorization 后进行
  - 未实现 Delivery executor
  - 未实现 Archify runtime
  - 未实现 stable Agent runtime
  - 未实现 automatic Author / Reviewer loop 或 bounded auto-continue
  - 未引入 Registry / Evidence platform
